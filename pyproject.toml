[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adsb-stack-manager"
version = "1.2.0"
description = "Desktop GUI to manage an ADS-B feeder over SSH"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ads-b", "dump1090", "piaware", "tar1090", "raspberry-pi", "readsb"]
dependencies = [
    "paramiko>=3.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.3",
    "build>=1.2",
]

[project.gui-scripts]
adsb-manager = "adsbmgr.gui:main"

[tool.setuptools.packages.find]
include = ["adsbmgr*"]
